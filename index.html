<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>小菡宝贝我爱你</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23ff3b6b' d='M12 21s-7.5-4.9-10-9.3C.4 8.6 2.3 5 5.7 5c2 0 3.4 1.1 4.3 2.4L12 9.6l2-2.2C14.9 6.1 16.3 5 18.3 5c3.4 0 5.3 3.6 3.7 6.7C19.5 16.1 12 21 12 21z'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg-1: #2b0a1e;
      --bg-2: #4a1030;
      --heart-a: #ff5d8f;
      --heart-b: #ff2d6f;
      --heart-c: #ff8fab;
      --text: #fff0f3;
      --glow: rgba(255, 77, 125, 0.55);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, var(--bg-2) 0%, var(--bg-1) 70%);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
      color: var(--text);
    }

    /* 背景漂浮的小爱心 */
    .float-heart {
      position: fixed;
      bottom: -60px;
      font-size: 22px;
      color: var(--heart-c);
      opacity: 0;
      animation: rise linear infinite;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes rise {
      0%   { transform: translateY(0) rotate(0deg) scale(0.6); opacity: 0; }
      10%  { opacity: 0.7; }
      90%  { opacity: 0.5; }
      100% { transform: translateY(-110vh) rotate(360deg) scale(1); opacity: 0; }
    }

    .stage {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4vh;
      padding: 24px;
    }

    /* 大爱心：标准 SVG 心形 */
    .heart-wrap {
      position: relative;
      width: min(66vw, 360px);
      height: min(66vw, 360px);
      animation: beat 1.6s ease-in-out infinite;
      filter: drop-shadow(0 18px 40px var(--glow));
    }

    .heart-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      14%      { transform: scale(1.12); }
      28%      { transform: scale(1); }
      42%      { transform: scale(1.1); }
      56%      { transform: scale(1); }
    }

    /* 爱心上的高光 */
    .heart-shine {
      position: absolute;
      top: 20%;
      left: 26%;
      width: 24%;
      height: 14%;
      background: rgba(255, 255, 255, 0.38);
      border-radius: 50%;
      filter: blur(6px);
      transform: rotate(-30deg);
      z-index: 3;
      pointer-events: none;
    }

    .love-text {
      text-align: center;
      font-size: clamp(28px, 7vw, 52px);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-shadow: 0 4px 18px rgba(255, 45, 111, 0.45);
      animation: fadeUp 1.2s ease both;
    }

    .love-text .name {
      color: var(--heart-c);
    }

    .sub-text {
      font-size: clamp(14px, 3vw, 18px);
      letter-spacing: 0.35em;
      opacity: 0.75;
      animation: fadeUp 1.2s ease 0.4s both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .heart-wrap, .float-heart { animation: none; }
      .love-text, .sub-text { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="heart-wrap" aria-hidden="true">
      <svg class="heart-svg" viewBox="0 0 100 100" role="img">
        <defs>
          <linearGradient id="heartGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ff5d8f" />
            <stop offset="55%" stop-color="#ff2d6f" />
            <stop offset="100%" stop-color="#ff8fab" />
          </linearGradient>
        </defs>
        <path fill="url(#heartGrad)" d="M50 88 C30 72 12 57 12 36 C12 22 22 13 33 13 C41 13 47 18 50 24 C53 18 59 13 67 13 C78 13 88 22 88 36 C88 57 70 72 50 88 Z" />
      </svg>
      <div class="heart-shine"></div>
    </div>
    <h1 class="love-text"><span class="name">小菡宝贝</span>我爱你</h1>
    <p class="sub-text">FOREVER LOVE</p>
  </main>

  <script>
    // 生成背景漂浮小爱心
    (function () {
      var symbols = ["❤", "♥"];
      var count = 14;
      for (var i = 0; i < count; i++) {
        var el = document.createElement("span");
        el.className = "float-heart";
        el.textContent = symbols[i % symbols.length];
        el.style.left = Math.random() * 100 + "vw";
        el.style.fontSize = 14 + Math.random() * 22 + "px";
        el.style.animationDuration = 7 + Math.random() * 8 + "s";
        el.style.animationDelay = Math.random() * 8 + "s";
        document.body.appendChild(el);
      }
    })();
  </script>
</body>
</html>
